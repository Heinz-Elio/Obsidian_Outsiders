vault:
  path: "Setting"

embedding:
  provider: ollama
  model: nomic-embed-text
  # Force CPU on machines where Ollama CUDA crashes (e.g. old GPU drivers).
  # Remove or set null to allow GPU offload.
  num_gpu: 0

chunking:
  max_tokens: 500
  overlap: 75

database:
  host: localhost
  port: 6333
  collection: obsidian

retrieval:
  top_k: 8

watcher:
  recursive: true