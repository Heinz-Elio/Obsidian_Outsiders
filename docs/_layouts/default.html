<!doctype html>
<html lang="{{ site.lang | default: 'zh-Hant' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#article">跳到正文</a>

    <div class="site-shell">
      <aside
        id="toc-sidebar"
        class="reading-sidebar reading-sidebar--left"
        aria-label="文章目錄"
      >
        <header class="sidebar-header">
          <strong>目錄</strong>
          <button
            id="toc-toggle"
            class="sidebar-toggle"
            type="button"
            aria-controls="toc-sidebar-content"
            aria-expanded="true"
          >
            收合目錄
          </button>
        </header>
        <div id="toc-sidebar-content" class="sidebar-content">
          <nav id="toc" aria-label="文章目錄"></nav>
        </div>
      </aside>

      <main id="article" class="article" tabindex="-1">
        {{ content }}
      </main>

      <aside
        id="glossary-sidebar"
        class="reading-sidebar reading-sidebar--right"
        aria-label="縮寫提示"
      >
        <header class="sidebar-header">
          <strong>縮寫</strong>
          <button
            id="glossary-toggle"
            class="sidebar-toggle"
            type="button"
            aria-controls="glossary-sidebar-content"
            aria-expanded="true"
          >
            收合縮寫
          </button>
        </header>
        <div id="glossary-sidebar-content" class="sidebar-content">
          <div id="glossary">
            <p class="sidebar-empty">文章尚未標記縮寫。</p>
          </div>
        </div>
      </aside>
    </div>

    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </body>
</html>
